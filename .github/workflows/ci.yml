name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ai,dev,github]"
      - name: Ruff
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[ai,dev,github]"
      - name: Test
        run: python -m pytest
      - name: Offline agent smoke test
        run: |
          python examples/agent_demo.py --home .experienceos-ci-demo
          experienceos ai eval

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed wheel outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/experienceos-wheel"
          "$RUNNER_TEMP/experienceos-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/experienceos-wheel/bin/experienceos" ai eval --report recorded-eval.json
