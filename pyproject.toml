[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experienceos"
version = "0.3.0"
description = "ExperienceOS - an open-source personal experience operating system. Never forget what you have built."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ExperienceOS Contributors" }]
requires-python = ">=3.10"
keywords = ["experience", "career", "knowledge-base", "ai-agent", "personal-os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ai = ["httpx>=0.27"]
github = ["httpx>=0.27"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/experienceos/experienceos"
Documentation = "https://github.com/experienceos/experienceos/tree/main/docs"

[project.scripts]
experienceos = "experienceos.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experienceos"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# the resume parser (#009) matches CJK punctuation by design; its tests
# assert against fullwidth strings; guardrails (#013) matches fullwidth ％
"src/experienceos/connectors/resume/*" = ["RUF001", "RUF002", "RUF003"]
"src/experienceos/core/guardrails.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_resume_connector.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer's DSL requires calling Option/Argument in parameter defaults
extend-immutable-calls = ["typer.Option", "typer.Argument", "typer.prompt"]
